apply plugin: 'com.android.application'

android {
    namespace 'com.novastar.sdkdemo'
    compileSdk 34

    defaultConfig {
        applicationId "com.novastar.sdkdemo"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }
    packaging {
        resources {
            excludes += 'META-INF/XXXX'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.textdemo'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    lint {
        // Legacy demo code; do not fail release builds on lint findings.
        abortOnError false
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs'] //相当于将libs文件夹当做jnilibs文件夹
        }
    }
}

if (project.hasProperty('debugKeystorePath')) {
    android.signingConfigs.debug.storeFile = file(project.property('debugKeystorePath'))
}

// Kotlin 1.8 merged kotlin-stdlib-jdk7/jdk8 into kotlin-stdlib; some transitive
// deps still pull the 1.6.21 artifacts whose classes duplicate stdlib 1.8.22.
// Align all three to 1.8.22 (jdk7/jdk8 are empty shims there) to avoid duplicates.
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
                'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22',
                'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    implementation files('libs/jna-min.jar')
    implementation files('libs/jna-platform.jar')
    implementation files('libs/QtAndroid.jar')
    implementation files('libs/QtAndroidBearer.jar')
}

// Android Studio Gradle 面板中运行 app:assembleDebug 时，构建成功后安装到已连接设备。
afterEvaluate {
    tasks.getByName('assembleDebug').finalizedBy(tasks.getByName('installDebug'))
}
