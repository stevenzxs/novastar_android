apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    defaultConfig {
        applicationId "com.novastar.sdkdemo"
        minSdkVersion 16
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'armeabi-v7a','arm64-v8a'
        }
    }
    packagingOptions {
        exclude 'META-INF/XXXX'
    }
    buildTypes {
        debug {
            applicationIdSuffix '.textdemo'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs'] //相当于将libs文件夹当做jnilibs文件夹
        }
    }
}

if (project.hasProperty('debugKeystorePath')) {
    android.signingConfigs.debug.storeFile = file(project.property('debugKeystorePath'))
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    implementation files('libs/jna-min.jar')
    implementation files('libs/jna-platform.jar')
    implementation files('libs/QtAndroid.jar')
    implementation files('libs/QtAndroidBearer.jar')
}

// Android Studio Gradle 面板中运行 app:assembleDebug 时，构建成功后安装到已连接设备。
afterEvaluate {
    tasks.getByName('assembleDebug').finalizedBy(tasks.getByName('installDebug'))
}
